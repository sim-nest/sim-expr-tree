[package]
name = "sim-lib-expr-tree-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
publish = true
description = "Authoritative bounded EvalSite server for SIM expression-tree sessions."

[dependencies]
sim-kernel = { version = "0.1.5" }
sim-lib-expr-tree = { version = "0.1.0", path = "../sim-lib-expr-tree" }
sim-lib-server = { version = "0.1.10" }
sim-lib-view = { version = "0.2.0" }
sim-lib-view-expr-tree = { version = "0.1.0", path = "../sim-lib-view-expr-tree" }
sim-lib-web-bridge = { version = "0.1.3" }
sim-web-shell = { version = "0.1.11" }
sim-value = { version = "0.1.2" }

[dev-dependencies]
serde_json = "1"
sim-codec-lisp = { version = "0.1.2" }
sim-codec-json = { version = "0.1.3" }
sim-kernel = { version = "0.1.5", features = ["test-support"] }
sim-lib-intent = { version = "0.2.0" }
sim-lib-scene = { version = "0.2.0" }

[lints]
workspace = true
