[[feature]]
id = "feature/sim-expr-tree/expression-tree"
title = "Loadable expression-tree framework"
summary = "Build finite named source trees over mixed Table/Dir storage and calculate them through a capability-gated runtime library with Shape and Card contracts, durable Citizens, bounded receipts, and standard streams."
owner = "crate/sim-lib-expr-tree"
audiences = ["code", "framework"]
guidance = "Use sim-lib-expr-tree when a runtime needs durable named calculations rather than a flat ephemeral cell. Load ExprTreeLib with codec/lisp, grant only expr-tree.read, expr-tree.write, expr-tree.calculate, and expr-tree.mount capabilities required by the caller, then use the ordinary expr-tree/* callables. Sources remain ordinary unevaluated Expr values and results remain ordinary Value values. Bare, relative, and absolute references reuse canonical Table paths; mixed backends reuse the core store and mount contracts; calculation reuses sim-expr-tree-calc and sim-incremental-core. Every operation publishes argument/result Shapes and a Card with its capability. DurableSourceRecord and DurablePolicyRecord reconstruct authored data, while TreeHandle remains opaque because it carries a live writer lane, backend access, and authority. The claimed tests exercise the complete operation inventory, bounded errors, capabilities, Shapes, Cards, Citizens, paths, mounts, calculation, receipts, streams, and reopen behavior. The two exact Lisp recipes demonstrate finite mixed-backend construction and automatic/manual cycle recovery without introducing a domain codec or evaluator."
supports = [
  "feature/sim-expr-tree/finite-namespace",
  "feature/sim-expr-tree/mixed-backend-storage",
  "feature/sim-expr-tree/incremental-calculation",
  "feature/sim-expr-tree/codec-policy",
]
claims_anchors = [
  "anchor/crate/sim-lib-expr-tree",
  "anchor/runtime-lib/sim-lib-expr-tree/expr-tree-lib",
  "anchor/rustdoc/sim-lib-expr-tree/crate-root",
]
claims_specimens = [
  "spec-test/sim-expr-tree/crates/sim-lib-expr-tree/src/tests",
  "recipe/sim-expr-tree/crates/sim-lib-expr-tree/01-basics/finite-tree",
  "recipe/sim-expr-tree/crates/sim-lib-expr-tree/02-calculation/automatic-and-directed",
]

[[feature]]
id = "feature/sim-expr-tree/codec-policy"
title = "Inherited codec policy and bounded value faces"
summary = "Decode edited source and encode source/result faces through installed codecs with field-wise tree/directory/cell policy, explicit positions, trusted diminished read policy, and independent hard-clamped byte/depth/item budgets."
owner = "crate/sim-expr-tree-calc"
audiences = ["code", "framework"]
guidance = "Use this row when an expression-tree caller needs safe codec-backed editing or presentation without changing the ordinary Expr/Value calculation model. Codec selectors are stable exported names resolved from each fresh runtime context, so removal fails closed and replacement takes effect without persisted process-local ids. Source codec, decode position, DecodeLimits, source budget, result codec, encode position, and result budget inherit independently from tree through ancestor directories to the cell. Eval-position edits require an explicitly trusted caller; ReadPolicy capabilities are intersected with effective cell authority, and non-eval positions remove read-eval even when ambient authority contains it. Source and result faces preflight expression payload bytes, depth, and items before invoking a trusted installed encoder, cap encoded output separately, forbid read-eval emission, and carry explicit truncation, unsupported-value, or codec-failure metadata. Result projection uses bounded data snapshots and bounded List/Table walks; callable and non-projectable values remain available as ordinary calculation Values and are never displayed or stringified by the face path. The claimed specimens cover inheritance, hard clamping, untrusted and diminished read-eval rejection, explicit trusted read-eval, decode limits, independent face budgets, pathological depth and item counts, huge payloads, callable results, codec removal/replacement, position-aware output, and Lisp/JSON general-purpose round trips."
supports = [
  "feature/sim-expr-tree/finite-namespace",
]
claims_anchors = [
  "anchor/crate/sim-expr-tree-calc",
  "anchor/rustdoc/sim-expr-tree-calc/crate-root",
  "anchor/crate/sim-expr-tree-core",
  "anchor/rustdoc/sim-expr-tree-core/crate-root",
]
claims_specimens = [
  "spec-test/sim-expr-tree/crates/sim-expr-tree-core/src/tests",
  "spec-test/sim-expr-tree/crates/sim-expr-tree-calc/src/tests",
]

[[feature]]
id = "feature/sim-expr-tree/expression-tree-view"
title = "Bounded reversible expression-tree outline"
summary = "Project revisioned expression-tree snapshots into a Mathematica-like expandable Scene and decode standard Intents back into capability-declared expression-tree operations."
owner = "crate/sim-lib-view-expr-tree"
audiences = ["code", "framework"]
guidance = "Use ExpressionTreeSurfaceCodec when a surface session needs to inspect and operate on a finite expression tree without inventing a domain view/edit or wire protocol. The snapshot value carries one authoritative tree target and revision. Collapsed directories and cells omit descendant and face payloads; expanded directories carry complete or explicitly truncated child pages; expanded cells carry already bounded source/result faces, all seven freshness states, revisions, optional human timestamps, inherited policy badges, and bounded receipt summaries. Scene projection uses standard tree, box, stack, field, badge, text, and button nodes. Dense and compact arrangements derive from open SurfaceCaps metadata, not a device enum. Disclosure, continuation, edits, cell/directory creation, movement, deletion, calculation, recursive/nonrecursive recalculation, cancellation, calculation/codec policy, and explanation all decode through the one SurfaceCodec. Every target includes the rendered revision, stale revisions fail closed, explicit continuation tokens are mandatory, and committed operations declare the existing expr-tree.read, expr-tree.write, or expr-tree.calculate capability. The claimed spec module covers every freshness state, arbitrary binary/unsupported/failed/truncated and oversized faces, hostile collapsed descendants, explicit continuation, stale revisions, accessibility labels, large trees, both layout classes, standard Intent coverage, and authorization."
supports = [
  "feature/sim-expr-tree/expression-tree",
  "feature/sim-expr-tree/codec-policy",
]
claims_anchors = [
  "anchor/crate/sim-lib-view-expr-tree",
  "anchor/rustdoc/sim-lib-view-expr-tree/crate-root",
]
claims_surfaces = [
  "view/sim-lib-view-expr-tree",
]
claims_specimens = [
  "spec-test/sim-expr-tree/crates/sim-lib-view-expr-tree/src/tests",
]

[[feature]]
id = "feature/sim-expr-tree/expression-tree-server"
title = "Authoritative expression tree EvalSite"
summary = "Serve bounded opaque expression tree sessions through one loadable EvalSite and EvalFabric, preserving caller authority, optimistic revisions, logical-time lifecycle policy, reversible surface operations, structured errors, and backpressured watches."
owner = "crate/sim-lib-expr-tree-server"
audiences = ["code", "framework"]
guidance = "Use ExpressionTreeServer when source, inherited policy, calculation, receipts, and live authority must remain authoritative across reconnecting clients. Load site/sim-lib-expr-tree-server, create a bounded opaque session, and send ordinary EvalRequest or ServerFrame requests through the existing EvalFabric and transport adapters. The site evaluates expr-tree/* calls in the caller Cx, accepts operations produced by ExpressionTreeSurfaceCodec, and implements generic web-session read, commit, realize, and change requests without adding a product transport. Snapshot revisions and mandatory logical ticks govern optimistic commits, event order, and idle expiry. The injected sim-lib-server WallClock contributes optional human observations only and may move backward or fail without affecting correctness. Per-server session, idle, page, depth, watch-count, and watch-buffer limits fail closed; slow consumers receive explicit lifetime overflow evidence; session and watch cancellation are explicit; restart invalidates old ids. The claimed specimen covers two clients, isolation, reconnect, standard frame correlation, direct SurfaceCodec intent handling, authority diminution, stale commits, slow consumers, cancellation, backward wall observations, idle expiry, and restart."
supports = [
  "feature/sim-expr-tree/expression-tree",
  "feature/sim-expr-tree/expression-tree-view",
]
claims_anchors = [
  "anchor/crate/sim-lib-expr-tree-server",
  "anchor/rustdoc/sim-lib-expr-tree-server/crate-root",
]
claims_surfaces = [
  "site/sim-lib-expr-tree-server",
]
claims_specimens = [
  "spec-test/sim-expr-tree/crates/sim-lib-expr-tree-server/src/tests",
]

[[route]]
id = "route/serve-authoritative-expression-tree"
task = "Serve an authoritative expression tree"
