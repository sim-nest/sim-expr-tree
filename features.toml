[[feature]]
id = "feature/sim-expr-tree/codec-policy"
title = "Inherited codec policy and bounded value faces"
summary = "Decode edited source and encode source/result faces through installed codecs with field-wise tree/directory/cell policy, explicit positions, trusted diminished read policy, and independent hard-clamped byte/depth/item budgets."
owner = "crate/sim-expr-tree-calc"
audiences = ["code", "framework"]
guidance = "Use this row when an expression-tree caller needs safe codec-backed editing or presentation without changing the ordinary Expr/Value calculation model. Codec selectors are stable exported names resolved from each fresh runtime context, so removal fails closed and replacement takes effect without persisted process-local ids. Source codec, decode position, DecodeLimits, source budget, result codec, encode position, and result budget inherit independently from tree through ancestor directories to the cell. Eval-position edits require an explicitly trusted caller; ReadPolicy capabilities are intersected with effective cell authority, and non-eval positions remove read-eval even when ambient authority contains it. Source and result faces preflight expression payload bytes, depth, and items before invoking a trusted installed encoder, cap encoded output separately, forbid read-eval emission, and carry explicit truncation, unsupported-value, or codec-failure metadata. Result projection uses bounded data snapshots and bounded List/Table walks; callable and non-projectable values remain available as ordinary calculation Values and are never displayed or stringified by the face path. The claimed specimens cover inheritance, hard clamping, untrusted and diminished read-eval rejection, explicit trusted read-eval, decode limits, independent face budgets, pathological depth and item counts, huge payloads, callable results, codec removal/replacement, position-aware output, and Lisp/JSON general-purpose round trips."
supports = [
  "feature/sim-expr-tree/finite-namespace",
]
claims_anchors = [
  "anchor/crate/sim-expr-tree-calc",
  "anchor/rustdoc/sim-expr-tree-calc/crate-root",
  "anchor/crate/sim-expr-tree-core",
  "anchor/rustdoc/sim-expr-tree-core/crate-root",
]
claims_specimens = [
  "spec-test/sim-expr-tree/crates/sim-expr-tree-core/src/tests",
  "spec-test/sim-expr-tree/crates/sim-expr-tree-calc/src/tests",
]

[[feature]]
id = "feature/sim-expr-tree/finite-namespace"
title = "Expression-tree finite namespace records"
summary = "Model backend-neutral expression-tree identities, finite parent/name entries, source stamps, inherited policy patches, and crash-safe generated-name reservations."
owner = "crate/sim-expr-tree-core"
audiences = ["code", "framework"]
guidance = "Use this row when expression-tree storage needs immutable TreeId, DirId, and CellId records, durable-before-create generated-name reservation, inherited codec policy resolution, or canonical Table path reference reuse. Namespace mutation goes through one serialized writer lane; reads inspect finite maps without allocating names."
claims_anchors = [
  "anchor/crate/sim-expr-tree-core",
  "anchor/rustdoc/sim-expr-tree-core/crate-root",
]
claims_specimens = [
  "spec-test/sim-expr-tree/crates/sim-expr-tree-core/src/tests",
]

[[feature]]
id = "feature/sim-expr-tree/incremental-calculation"
title = "Expression-tree incremental calculation"
summary = "Calculate ordinary Expr sources into ordinary Value results through one bounded incremental engine with validated Table-backed restarts, explicit backend refresh, inherited triggers, immutable authority ceilings, restartable automatic work, standard progress streams, and inspectable receipts."
owner = "crate/sim-expr-tree-calc"
audiences = ["code", "framework"]
guidance = "Use this row when calculated expression-tree cells must depend on the cells, missing names, lookup steps, listings, mount epochs, inherited policy, codec registry revision, and authority observations actually read while evaluating. The calc layer evaluates ordinary Expr through a fresh diminished Cx and retains ordinary Value, preserving lexical/runtime bindings before tree lookup and reusing sim-incremental-core for dependency-first verification, reverse invalidation, cycle paths, continuations, failure memos, and canonical cutoff. Its versioned derived Table record persists source/control generations and identities, graph observations, reverse edges, memos, receipts, refresh samples, and automatic continuations; reopen validates the whole record and rehydrates intact work without reevaluation, while missing, corrupt, incompatible, or mismatched state is deleted and conservatively rebuilt without changing source. Explicit refresh samples only mounted backends without watch contracts, compares epochs, listings, and stamps, and invalidates affected observations; ordinary reads and explanation never poll backends. Calculation policy inherits field by field from tree through directories to cells; Automatic, OnDemand, Manual, and Frozen triggers share verify, force-roots, and force-recursive request machinery. One immutable open-time CapabilitySet ceiling is intersected with allows and reduced by accumulated denials before required-capability checks, so later contexts or persisted policy edits cannot escalate it. Automatic work is budgeted, debounced, priority-aware, fairly selected, cancellable, and exportable as a deterministic restartable queue. Progress and changes use sim-lib-stream-core StreamValue endpoints with explicit BufferPolicy and overflow evidence. Every attempt commits bounded source, policy, authority, dependency, logical/wall time, effect-ledger, fingerprint, outcome, and reason evidence exposed without evaluation through explain. Citizen/read-construct and other canonical as_expr projections receive stable fingerprints; valid opaque, callable, and noncanonical Dir values remain ordinary Value but are volatile. Hard work, observation, query-depth, expression-depth, output, receipt, queue-turn, stream, graph-node, and graph-edge bounds clamp every requested policy. The claimed calculation specimen covers dynamic references and full-value verification plus kill/reopen reuse, corruption, schema and generation mismatch, derived deletion, interrupted continuation, stale external mutation, explicit refresh, non-polling ordinary reads/explanation, policy inheritance, all triggers and force modes, non-escalation, required-capability failure, effect evidence, budget continuation, debounce, priority fairness, cancellation, manual/frozen blocking, bounded stream overflow, receipt correctness, and wall-clock rollback."
supports = [
  "feature/sim-expr-tree/finite-namespace",
  "feature/sim-expr-tree/mixed-backend-storage",
]
claims_anchors = [
  "anchor/crate/sim-expr-tree-calc",
  "anchor/rustdoc/sim-expr-tree-calc/crate-root",
]
claims_specimens = [
  "spec-test/sim-expr-tree/crates/sim-expr-tree-calc/src/tests",
]

[[feature]]
id = "feature/sim-expr-tree/mixed-backend-storage"
title = "Expression-tree mixed backend storage"
summary = "Compose authored source, operational control, versioned rebuildable derived graphs, and explicit Table/Dir mounts without flattening mounted backend behavior."
owner = "crate/sim-expr-tree-core"
audiences = ["code", "framework"]
guidance = "Use this row when an expression tree needs one root Dir with independently typed source, control, and derived stores plus explicit mounted Table/Dir descriptors. This composes the foundation Table/Dir core and storage mounted-table-dir namespace features. Source entries hold authored expressions only; counters, policies, mount epochs, UI preferences, graphs, cached values, receipts, refresh observations, and scheduler continuations stay in the control or derived lanes. Source/control commits define the recoverable transaction boundary. The calculation layer's ordinary Table adapter persists a schema- and generation-validated derived graph that can be rehydrated when intact and discarded without source mutation when missing, corrupt, incompatible, or mismatched. The claimed specimens cover store composition plus derived-store reopen, deletion, damage recovery, and explicit non-watch backend refresh."
supports = [
  "feature/sim-expr-tree/finite-namespace",
]
claims_anchors = [
  "anchor/crate/sim-expr-tree-core",
  "anchor/rustdoc/sim-expr-tree-core/crate-root",
]
claims_specimens = [
  "spec-test/sim-expr-tree/crates/sim-expr-tree-core/src/tests",
  "spec-test/sim-expr-tree/crates/sim-expr-tree-calc/src/tests",
]
