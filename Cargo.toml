[workspace]
resolver = "3"
members = [
  "crates/sim-expr-tree",
  "crates/sim-expr-tree-calc",
  "crates/sim-expr-tree-core",
  "crates/sim-lib-expr-tree",
  "crates/sim-lib-expr-tree-serve",
  "crates/sim-lib-expr-tree-server",
  "crates/sim-lib-view-expr-tree",
  "xtask",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/sim-nest/sim-expr-tree"
homepage = "https://github.com/sim-nest/sim-expr-tree"

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
sim-lib-server = { path = "../sim-agent-net/crates/sim-lib-server" }
sim-lib-intent = { path = "../sim-web/crates/sim-lib-intent" }
sim-lib-scene = { path = "../sim-web/crates/sim-lib-scene" }
sim-lib-view = { path = "../sim-web/crates/sim-lib-view" }
sim-lib-view-device = { path = "../sim-web/crates/sim-lib-view-device" }
sim-lib-view-spatial = { path = "../sim-web/crates/sim-lib-view-spatial" }
sim-lib-web-bridge = { path = "../sim-web/crates/sim-lib-web-bridge" }
sim-web-shell = { path = "../sim-web/crates/sim-web-shell" }
sim-lib-stream-fabric = { path = "../sim-agent-net/crates/sim-lib-stream-fabric" }
