[[feature]]
id = "feature/sim-expr-tree/finite-namespace"
title = "Expression-tree finite namespace records"
summary = "Model backend-neutral expression-tree identities, finite parent/name entries, source stamps, inherited policy patches, and crash-safe generated-name reservations."
owner = "crate/sim-expr-tree-core"
audiences = ["code", "framework"]
guidance = "Use this row when expression-tree storage needs immutable TreeId, DirId, and CellId records, durable-before-create generated-name reservation, inherited codec policy resolution, or canonical Table path reference reuse. Namespace mutation goes through one serialized writer lane; reads inspect finite maps without allocating names."
claims_anchors = [
  "anchor/crate/sim-expr-tree-core",
  "anchor/rustdoc/sim-expr-tree-core/crate-root",
]
claims_specimens = [
  "spec-test/sim-expr-tree/crates/sim-expr-tree-core/src/tests",
]

[[feature]]
id = "feature/sim-expr-tree/incremental-calculation"
title = "Expression-tree incremental calculation"
summary = "Calculate ordinary Expr sources into ordinary Value results through one bounded incremental engine with inherited triggers, directed force modes, immutable authority ceilings, restartable automatic work, standard progress streams, and inspectable receipts."
owner = "crate/sim-expr-tree-calc"
audiences = ["code", "framework"]
guidance = "Use this row when calculated expression-tree cells must depend on the cells, missing names, lookup steps, listings, mount epochs, inherited policy, codec registry revision, and authority observations actually read while evaluating. The calc layer evaluates ordinary Expr through a fresh diminished Cx and retains ordinary Value, preserving lexical/runtime bindings before tree lookup and reusing sim-incremental-core for dependency-first verification, reverse invalidation, cycle paths, continuations, failure memos, and canonical cutoff. Calculation policy inherits field by field from tree through directories to cells; Automatic, OnDemand, Manual, and Frozen triggers share verify, force-roots, and force-recursive request machinery. One immutable open-time CapabilitySet ceiling is intersected with allows and reduced by accumulated denials before required-capability checks, so later contexts or persisted policy edits cannot escalate it. Automatic work is budgeted, debounced, priority-aware, fairly selected, cancellable, and exportable as a deterministic restartable queue. Progress and changes use sim-lib-stream-core StreamValue endpoints with explicit BufferPolicy and overflow evidence. Every attempt commits bounded source, policy, authority, dependency, logical/wall time, effect-ledger, fingerprint, outcome, and reason evidence exposed without evaluation through explain. Citizen/read-construct and other canonical as_expr projections receive stable fingerprints; valid opaque, callable, and noncanonical Dir values remain ordinary Value but are volatile. Hard work, observation, query-depth, expression-depth, output, receipt, queue-turn, and stream bounds clamp every requested policy. The claimed calculation specimen covers dynamic references and full-value verification plus policy inheritance, all triggers and force modes, non-escalation, required-capability failure, effect evidence, budget continuation, debounce, priority fairness, restart/cancellation, manual/frozen blocking, bounded stream overflow, receipt correctness, explanation, and wall-clock rollback."
supports = [
  "feature/sim-expr-tree/finite-namespace",
  "feature/sim-expr-tree/mixed-backend-storage",
]
claims_anchors = [
  "anchor/crate/sim-expr-tree-calc",
  "anchor/rustdoc/sim-expr-tree-calc/crate-root",
]
claims_specimens = [
  "spec-test/sim-expr-tree/crates/sim-expr-tree-calc/src/tests",
]

[[feature]]
id = "feature/sim-expr-tree/mixed-backend-storage"
title = "Expression-tree mixed backend storage"
summary = "Compose authored source, operational control, rebuildable derived state, and explicit Table/Dir mounts without flattening mounted backend behavior."
owner = "crate/sim-expr-tree-core"
audiences = ["code", "framework"]
guidance = "Use this row when an expression tree needs one root Dir with independently typed source, control, and derived stores plus explicit mounted Table/Dir descriptors. This composes the foundation Table/Dir core and storage mounted-table-dir namespace features. Source entries hold authored expressions only; counters, policies, mount epochs, UI preferences, graphs, cached values, and receipts stay in the control or derived lanes. Source/control commits define the recoverable transaction boundary, while derived state is rebuildable."
supports = [
  "feature/sim-expr-tree/finite-namespace",
]
claims_anchors = [
  "anchor/crate/sim-expr-tree-core",
  "anchor/rustdoc/sim-expr-tree-core/crate-root",
]
claims_specimens = [
  "spec-test/sim-expr-tree/crates/sim-expr-tree-core/src/tests",
]
