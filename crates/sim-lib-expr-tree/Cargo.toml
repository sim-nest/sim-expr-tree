[package]
name = "sim-lib-expr-tree"
version = "0.4.0"
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
publish = true
description = "Loadable, Shape-checked SIM expression-tree runtime library."

[dependencies]
sim-citizen = { version = "0.4.0" }
sim-citizen-derive = { version = "0.4.0" }
sim-cookbook = { version = "0.4.0" }
sim-expr-tree-calc = { version = "0.4.0", path = "../sim-expr-tree-calc" }
sim-expr-tree-core = { version = "0.3.0", path = "../sim-expr-tree-core" }
sim-kernel = { version = "0.4.0" }
sim-host-core = { version = "0.2.0" }
sim-lib-stream-core = { version = "0.3.0" }
sim-shape = { version = "0.4.0" }
sim-table-core = { version = "0.3.0" }

[build-dependencies]
sim-cookbook-build = { version = "0.2.0" }

[dev-dependencies]
sim-codec = { version = "0.3.0" }
sim-codec-lisp = { version = "0.4.0" }
sim-kernel = { version = "0.4.0", features = ["test-support"] }

[lints]
workspace = true
